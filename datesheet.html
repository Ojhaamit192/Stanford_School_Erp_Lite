<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Datesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FF6A00">
<style>
  :root{ --bg:#0D0A08; --bg-panel:#1A130E; --line:#3D2A1A; --gold:#FF6A00; --gold-soft:#FFB020; --text:#F5F0EA; --text-dim:#C9B29A; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Fraunces',serif; font-weight:500;}
  .wrap{max-width:600px; margin:0 auto; padding:28px 18px 60px;}
  .eyebrow{color:var(--gold-soft); font-size:0.85rem; margin-bottom:6px;}
  h1{font-size:1.5rem; margin-bottom:4px; text-align:center;}
  .sub{color:var(--text-dim); font-size:0.9rem; margin-bottom:24px; text-align:center;}
  .card{background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px;}
  .exam-name{color:var(--gold-soft); font-size:0.95rem; font-weight:600; margin-bottom:4px;}
  .posted{color:var(--text-dim); font-size:0.78rem; margin-bottom:10px;}
  .card p{white-space:pre-wrap;}
  .empty{color:var(--text-dim); text-align:center; padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center; margin-bottom:8px;"><img src="assets/tejvix-logo.png" alt="Tejvix" style="height:44px; width:44px; border-radius:10px;"></div>
  <div class="eyebrow" id="schoolName" style="text-align:center;">Loading…</div>
  <h1 id="className">Exam Datesheet</h1>
  <div class="sub">Recent datesheets</div>
  <div id="list"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('school');
const className = params.get('class');
document.getElementById('className').textContent = className ? `${className} — Datesheet` : 'Datesheet';

async function load(){
  const box = document.getElementById('list');
  if(!slug || !className){ box.innerHTML = '<p class="empty">Invalid link.</p>'; return; }
  try{
    const res = await fetch(`/api/datesheet?slug=${encodeURIComponent(slug)}&class=${encodeURIComponent(className)}&public=1`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Load fail');
    document.getElementById('schoolName').textContent = data.school.name;
    if(!data.datesheets.length){ box.innerHTML = '<p class="empty">No datesheet posted yet.</p>'; return; }
    box.innerHTML = data.datesheets.map(d => `
      <div class="card">
        <div class="exam-name">${d.exam_name}</div>
        <div class="posted">${new Date(d.created_at).toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'})}</div>
        <p>${d.text}</p>
      </div>
    `).join('');
  }catch(e){
    box.innerHTML = '<p class="empty">Could not load the datesheet.</p>';
  }
}
load();
</script>
</body>
</html>
