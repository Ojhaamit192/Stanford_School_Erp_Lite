name: Nightly Supabase Backup

on:
  schedule:
    - cron: "30 20 * * *" # 2:00 AM IST every night
  workflow_dispatch: {} # lets you also run it manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Export tables to CSV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.js

      - name: Commit backup
        run: |
          git config user.name "school-lite-backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Nightly backup $(date -u +%Y-%m-%d)"
          git push
